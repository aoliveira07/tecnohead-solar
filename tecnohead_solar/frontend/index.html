<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#062b36" />
    <title>TecnoHead Solar</title>
    <link rel="stylesheet" href="static/style.css" />
  </head>
  <body>
    <div class="app-shell">
      <aside class="sidebar" aria-label="Navegação TecnoHead Solar">
        <div class="brand">
          <img src="logo.png" alt="TecnoHead Solar" class="brand-logo" />
          <span class="brand-kicker">MONITORAMENTO LOCAL</span>
        </div>
        <nav id="navigation" class="navigation">
          <button class="nav-link active" data-route="overview">Visão geral</button>
          <button class="nav-link" data-route="collectors">Microinversores</button>
          <button class="nav-link" data-route="map">Esquema de placas</button>
          <button class="nav-link" data-route="diagnostics">Diagnósticos e alertas</button>
          <button class="nav-link" data-route="history">Histórico e relatórios</button>
          <button class="nav-link" data-route="settings">Configurações</button>
        </nav>
        <div class="sidebar-footer">
          <span class="status-pill" id="sidebar-api-status"><i></i> API desabilitada</span>
          <small id="app-version">TecnoHead Solar · carregando</small>
        </div>
      </aside>

      <main class="main-content">
        <header class="topbar">
          <div>
            <span class="eyebrow">TECNOHEAD SOLAR</span>
            <h1 id="page-title">Visão geral</h1>
            <p id="page-subtitle">Produção real, potencial teórico e saúde da comunicação local.</p>
          </div>
          <div class="topbar-actions">
            <button class="icon-button" id="refresh-button" title="Atualizar dados" aria-label="Atualizar dados">↻</button>
            <button class="primary-button" data-route="settings">Configurar instalação</button>
          </div>
        </header>

        <section id="toast" class="toast" role="status" aria-live="polite"></section>
        <section id="page-overview" class="page active-page"></section>
        <section id="page-collectors" class="page"></section>
        <section id="page-map" class="page"></section>
        <section id="page-diagnostics" class="page"></section>
        <section id="page-history" class="page"></section>
        <section id="page-settings" class="page"></section>
      </main>
    </div>
    <script src="static/app.js" defer></script>
  </body>
</html>
